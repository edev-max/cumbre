# Arma el instalador de Cumbre para Windows (.exe y .msi) en cada cambio a main
# y en cada etiqueta vX.Y.Z. El instalador queda en "Artifacts" de la ejecución;
# con una etiqueta, además se publica un borrador de release con
# Cumbre-instalador.exe (el nombre fijo al que apunta el botón del README).
name: Instalador de Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  windows:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - run: npm ci
      - name: Pruebas de Rust (tasa BCV y respaldos)
        working-directory: src-tauri
        run: cargo test --lib
      - name: Armar instalador
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Cumbre ${{ github.ref_name }}'
          releaseDraft: true
      - name: Adjuntar Cumbre-instalador.exe a la release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe Cumbre-instalador.exe
          gh release upload "${{ github.ref_name }}" Cumbre-instalador.exe --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: cumbre-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
