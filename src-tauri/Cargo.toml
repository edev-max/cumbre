[package]
name = "cumbre"
version = "0.2.1"
description = "Cumbre, by Apex Consulting"
authors = ["Apex Consulting"]
edition = "2021"

[lib]
name = "cumbre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
machine-uid = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-dialog = "2"
# HTTP para la tasa del BCV: TLS del sistema (SChannel en Windows), que completa
# solo la cadena de certificados del BCV
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
